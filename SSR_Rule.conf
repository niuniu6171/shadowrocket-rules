DOMAIN,raw.githubusercontent.com,PROXY
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/4435ba4141d82aab94e541e29023fc6a1f627723/rule/Shadowrocket/Global/Global_Domain.list,PROXY
# 与 Clash China_Domain.yaml 对齐：小火箭上游将这两项放在另一个文件。
DOMAIN-SUFFIX,cn,DIRECT
DOMAIN-SUFFIX,ms,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/4435ba4141d82aab94e541e29023fc6a1f627723/rule/Shadowrocket/China/China_Domain.list,DIRECT
